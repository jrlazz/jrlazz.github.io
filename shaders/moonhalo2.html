<!DOCTYPE html>
<html lang="en">
<head>
<title>moonhalo.html</title>
<meta charset="utf-8">

<link rel="icon" type="image/png" href="../img/github-mark.png">
<meta name="description" content="walking on a moonlit night">
<meta name="twitter:image" content="img/ag_baboy_right.png" />
<meta name="twitter:image:type" content="png" />
<meta name="twitter:image:width" content="19" />
<meta name="twitter:image:height" content="47" />

<style>
body{overflow:hidden;margin:0px;background:#001;font-family:monospace;font-size:10.25pt;background-image:url(images/nightsky.jpg);background-size:100%100%;}
span{position:absolute;left:10px;top:10px;color:#660;font-size:10.25pt;}
</style>

<script type="importmap">
{
	"imports":{
		"three":"https://unpkg.com/three@0.166.0/build/three.module.min.js",
		"three/addons/":"https://unpkg.com/three@0.166.0/examples/jsm/"
	}
}
</script>

</head>

<body>
<span style="top:10px;left:10px;font-size:20.5px;">... walking on a moonlit night ...</span>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

var camera,scene,renderer,controls,tex,group,innerGeo,innerMat,innerShell,outerShell,outerGeo,outerMat,innerSphere,textMesh;
var text,textGeo,materials,bevelEnabled=true,font=undefined;
var groupmoon=new THREE.Group();;
var t=0;
var w=0;
var k=0;
var altera=0;

var rot=new Array();rot[1]=0;

var BDs,BDi,BEs,BEi,PDs,PDi,PEs,PEi,CA,TR;
var group=new THREE.Group();
var groupCATR=new THREE.Group();
var groupPD=new THREE.Group();
var groupPE=new THREE.Group();
var groupBD=new THREE.Group();
var groupBE=new THREE.Group();

var p=Math.PI;

var altera=0;

var passo=0.005;

function init() {

	scene=new THREE.Scene();

	camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,1,1000);
	camera.position.set(0,0,20);

	renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
	renderer.setPixelRatio(window.devicePixelRatio);
	renderer.setClearColor('#001',0);
	renderer.setSize(window.innerWidth,window.innerHeight);
	document.body.appendChild(renderer.domElement);

	window.addEventListener('resize',onWindowResize);

	//controls=new OrbitControls(camera,renderer.domElement);
	//controls.enableRotate=false;

	scene.add(new THREE.AmbientLight("#fff",3));

	tex=new THREE.TextureLoader().load("images/moon2kr.jpg");

	innerGeo=new THREE.SphereGeometry(2,32,32);
	innerMat=new THREE.MeshStandardMaterial({color:'#fed',map:tex});
	innerSphere=new THREE.Mesh(innerGeo,innerMat);
	innerSphere.rotation.y=1.57;

	for(let z=1;z<50;z++){
		outerMat=new THREE.MeshStandardMaterial({color:'#fed',side:THREE.BackSide,transparent:true,opacity:0.8-z/50});
		outerGeo=new THREE.SphereGeometry(z/8,7,7);
		outerShell=new THREE.Mesh(outerGeo,outerMat);
		groupmoon.add(outerShell);
	}

	const manager=new THREE.LoadingManager();
	manager.onStart=function(url,itemsLoaded,itemsTotal){console.log('Started loading file:'+url+'.\nLoaded '+itemsLoaded+' of '+itemsTotal + ' files.');};
	manager.onLoad=function(){console.log('Loading complete!');};
	manager.onProgress=function(url,itemsLoaded,itemsTotal){console.log('loading texture'+url+' '+(itemsLoaded/itemsTotal*100)+'%');};
	manager.onError=function(url){console.log('Error loading texture:'+url);};

	var mo="models/partes.mtl";
	var cox="models/vivicox.obj";
	new MTLLoader(manager).load(mo,function(mat){mat.preload();new OBJLoader(manager).setMaterials(mat).load('models/steve_ca.obj',function(object){object.children[k].castShadow=true;CA=object;},manager.onProgress,manager.onError);});
	new MTLLoader(manager).load(mo,function(mat){mat.preload();new OBJLoader(manager).setMaterials(mat).load('models/steve_to.obj',function(object){object.children[k].castShadow=true;TR=object;},manager.onProgress,manager.onError);});
	new MTLLoader(manager).load(mo,function(mat){mat.preload();new OBJLoader(manager).setMaterials(mat).load(cox,function(object)                        {object.children[k].castShadow=true;BDs=object;},manager.onProgress,manager.onError);});

	text="... beatifull moon halo ... ";
	const height=2,size=8,hover=30,curveSegments=1,bevelThickness=0.1,bevelSize=0.1;
	const loader=new FontLoader();
	loader.load('../fonte/Cascadia_Regular.json',function(response){font=response;createText();
	});

function createText() {
	textGeo=new TextGeometry(text,{font:font,size:size,height:height,curveSegments:curveSegments,bevelThickness:bevelThickness,bevelSize:bevelSize,bevelEnabled:bevelEnabled});
        textGeo.center();
	materials=[
		new THREE.MeshPhongMaterial({color:0xffff00,flatShading:true}),
		new THREE.MeshPhongMaterial({color:0x005599})
	];
	textMesh=new THREE.Mesh(textGeo,materials);
	textMesh.position.set(10,16,96);
	textMesh.rotation.y=-p/2;
}

} // init END

function onWindowResize(){
	camera.aspect=window.innerWidth/window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate() { 
	requestAnimationFrame(animate);

	if(w<51){w++;}
	if(altera==0 && w==50){alterando();}
	if(altera>0){
		if(groupPD.rotation.x> 1.07){rot[1]=1;PEi.rotation.x=0;}
		if(groupPD.rotation.x<-1.07){rot[1]=0;PDi.rotation.x=0;}
		if(rot[1]==0){
			group.rotation.z +=passo;
			groupPD.rotation.x +=passo*10;
			groupPE.rotation.x -=passo*10;
			groupBD.rotation.x -=passo*10;
			groupBE.rotation.x +=passo*10;
				CA.rotation.y -=passo*2;
				TR.rotation.x +=passo;
					//BDi.rotation.x -=passo*2;
					//BEi.rotation.x +=passo*2;
					//PDi.rotation.x +=passo;
					//PEi.rotation.x -=passo;
		}else{
			group.rotation.z -=passo;
			groupPD.rotation.x -=passo*10;
			groupPE.rotation.x +=passo*10;
			groupBD.rotation.x +=passo*10;
			groupBE.rotation.x -=passo*10;
				CA.rotation.y +=passo*2;
				TR.rotation.x -=passo;
					//BDi.rotation.x +=passo*2;
					//BEi.rotation.x -passo*2;
					//PDi.rotation.x -=passo;
					//PEi.rotation.x +=passo;
		}
		group.position.x +=0.05;
		if(group.position.x>40){group.position.x=-40;}
		if(group.position.x>-10){textMesh.visible=true;}
		if(group.position.x>10){textMesh.visible=false;}
	}

	if(t<31){t++;}
	if(t==30 && tex && innerSphere){
		groupmoon.add(innerSphere);
		groupmoon.position.y=5;;
		scene.add(groupmoon);
	}

	function alterando(){
		//alert("vai");
		CA.position.set(0  ,2.1,0); // steve_ca
		TR.position.set(0  ,2  ,0); // steve_to
		BDs.position.set(-1.75,   1,0); // vivicox
		BDi=BDs.clone();
			BDi.position.set(-1.75,-0.5,0);
		BEs=BDs.clone();
			BEs.position.set(1.75,   1,0);
		BEi=BDs.clone();
			BEi.position.set(1.75,-0.5,0);
		PDs=BDs.clone();
			PDs.position.set(0.025,   0,0);
		PDi=BDs.clone();
			PDi.position.set(0.025,-1.5,0);
		PEs=BDs.clone();
			PEs.position.set(0.56,    0,0);
		PEi=BDs.clone();
			PEi.position.set(0.56, -1.5,0);

		BDs.scale.y=0.5;
		BEs.scale.y=0.5;
		BDi.scale.set(0.75,0.75,0.75);
		BEi.scale.set(0.75,0.75,0.75);

		PDs.scale.y=0.5;
		PEs.scale.y=0.5;
		PDi.scale.set(0.85,0.85,0.85);
		PEi.scale.set(0.85,0.85,0.85);

		groupCATR.add(CA);groupCATR.add(TR);
		groupPD.add(PDs);groupPD.add(PDi);
		groupPE.add(PEs);groupPE.add(PEi);
		groupBD.add(BDs);groupBD.add(BDi);
		groupBE.add(BEs);groupBE.add(BEi);

		groupCATR.scale.set(4,4,4);
		groupPD.scale.set(4,4,4);
		groupPE.scale.set(4,4,4);
		groupBD.scale.set(4,4,4);
		groupBE.scale.set(4,4,4);

		group.add(groupCATR);
		group.add(groupPD);
		group.add(groupPE);
		group.add(groupBD);
		group.add(groupBE);

		groupCATR.position.set(  0,4,0);
		groupPD.position.set(-2.5,0,0);
		groupPE.position.set(0.0,0,0);
		groupBD.position.set(0.0,8,0);
		groupBE.position.set(0.0,8,0);

		group.rotation.y=p/2;
		group.position.set(-40,-11,0);
		group.scale.setScalar(0.1);
		textMesh.visible=false;
		group.add(textMesh);
		scene.add(group);
		altera++;
	}

	renderer.render(scene,camera);
}

init();
animate();

</script>

</body>
</html>
