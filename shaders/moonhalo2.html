<!DOCTYPE html>
<html lang="en">
<head>
<title>moonhalo2.html</title>
<meta charset="utf-8">

<link rel="icon" type="image/png" href="../img/github-mark.png">
<meta name="description" content="walking on a moonlit night">
<meta name="twitter:image" content="img/ag_baboy_right.png" />
<meta name="twitter:image:type" content="png" />
<meta name="twitter:image:width" content="19" />
<meta name="twitter:image:height" content="47" />

<style>
body{overflow:hidden;margin:0px;background:#001;font-family:monospace;font-size:10.25pt;background-size:100%100%;}
span{position:absolute;left:10px;top:10px;color:#660;font-size:10.25pt;}
</style>

<script type="importmap">
{
	"imports":{
		"three":"https://unpkg.com/three@0.166.0/build/three.module.min.js",
		"three/addons/":"https://unpkg.com/three@0.166.0/examples/jsm/"
	}
}
</script>

</head>

<body>
<span style="top:10px;left:10px;font-size:20.5px;">... walking on a moonlit night ...</span>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

var camera,scene,renderer,controls,moontex,group,innerGeo,innerMat,innerShell,outerShell,outerGeo,outerMat,innerSphere,textMesh;
var loader,text,textGeo,materials,bevelEnabled=true,font=undefined;
var groupmoon=new THREE.Group();;
var t=0;
var w=0;
var k=0;
var altera=0;

var rot=new Array();rot[1]=0;

var BDs,BEs,PDs,PEs,CA,TR;
var group=new THREE.Group();
var groupCATR=new THREE.Group();

var BDsS,BEsS,PDsS,PEsS,CAS,TRS;
var groupS=new THREE.Group();
var groupCATRS=new THREE.Group();

var p=Math.PI;

var altera=0;

var passo=0.005;

var ste=[],tex=[];

var pare=0;

function init() {

	scene=new THREE.Scene();

	camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,1,1000);
	camera.position.set(0,0,20);

	renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
	renderer.setPixelRatio(window.devicePixelRatio);
	renderer.setClearColor('#001',0);
	renderer.setSize(window.innerWidth,window.innerHeight);
	document.body.appendChild(renderer.domElement);

	loader = new THREE.TextureLoader();
	loader.load('images/nightsky.jpg',function(texture){
		texture.colorSpace = THREE.SRGBColorSpace;
		scene.background = texture;
	});

	window.addEventListener('resize',onWindowResize);

	//controls=new OrbitControls(camera,renderer.domElement);

	scene.add(new THREE.AmbientLight("#fff",3));

	moontex=new THREE.TextureLoader().load("images/moon2kr.jpg");

	innerGeo=new THREE.SphereGeometry(2,32,32);
	innerMat=new THREE.MeshStandardMaterial({color:'#fed',map:moontex});
	innerSphere=new THREE.Mesh(innerGeo,innerMat);
	innerSphere.rotation.y=1.57;

	for(let z=1;z<50;z++){
		outerMat=new THREE.MeshStandardMaterial({color:'#fed',side:THREE.BackSide,transparent:true,opacity:0.8-z/50});
		outerGeo=new THREE.SphereGeometry(z/8,7,7);
		outerShell=new THREE.Mesh(outerGeo,outerMat);
		groupmoon.add(outerShell);
	}

	const manager=new THREE.LoadingManager();
	manager.onStart=function(url,itemsLoaded,itemsTotal){console.log('Started loading file:'+url+'.\nLoaded '+itemsLoaded+' of '+itemsTotal + ' files.');};
	manager.onLoad=function(){console.log('Loading complete!');};
	manager.onProgress=function(url,itemsLoaded,itemsTotal){console.log('loading texture'+url+' '+(itemsLoaded/itemsTotal*100)+'%');};
	manager.onError=function(url){console.log('Error loading texture:'+url);};

	tex[99]=new THREE.TextureLoader().load('models/ski99.png');tex[99].colorSpace = THREE.SRGBColorSpace;
	new MTLLoader(manager).load('models/partesfoscas.mtl',function(mat){mat.preload();new OBJLoader(manager).setMaterials(mat).load('models/separa9.obj',function(object){
	for(let k=0;k<6;k++){if(object.children[k]){ste[k]=object.children[k];ste[k].material=new THREE.MeshStandardMaterial({map:tex[49]});}}}),manager.onProgress,manager.onError;});

	tex[49]=new THREE.TextureLoader().load('models/ski49.png');tex[49].colorSpace = THREE.SRGBColorSpace;
	new MTLLoader(manager).load('models/partesfoscas.mtl',function(mat){mat.preload();new OBJLoader(manager).setMaterials(mat).load('models/separa9.obj',function(object){
	for(let k=0;k<6;k++){if(object.children[k]){ste[k+10]=object.children[k];ste[k+10].material=new THREE.MeshStandardMaterial({map:tex[99]});}}}),manager.onProgress,manager.onError;});

	text="... beautiful moon's halo\n     Let's stay together ...";
	const depth=1,size=2,curveSegments=1,bevelThickness=0.1,bevelSize=0.1,multiline=true;
	loader=new FontLoader();
	loader.load('../fonte/Cascadia_Regular.json',function(response){font=response;createText();});
	function createText(){
		textGeo=new TextGeometry(text,{font:font,size:size,depth:depth,curveSegments:curveSegments,bevelThickness:bevelThickness,bevelSize:bevelSize,bevelEnabled:bevelEnabled,multiline:true});
		textGeo.center();
			materials=[
			new THREE.MeshPhongMaterial({color:'#ff0'}),new THREE.MeshPhongMaterial({color:'#60f'})];
		textMesh=new THREE.Mesh(textGeo,materials);
		textMesh.position.set(0,10,0);
		textMesh.rotation.y=-p;
	}	

} // init END

function onWindowResize(){
	camera.aspect=window.innerWidth/window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate() { 
	requestAnimationFrame(animate);

	if(w<51  && ste[5]){w++;}
	if(altera==0 && w==50){alterando();}
	if(altera>0){
		if(pare==0){
			if(PDs.rotation.x> 1.07){rot[1]=1;}
			if(PDs.rotation.x<-1.07){rot[1]=0;}
			if(rot[1]==0){
				CA.rotation.y -=0.01;
				TR.rotation.x +=0.005;
				BDs.rotation.x -=0.05;
				BEs.rotation.x +=0.05;
				PDs.rotation.x +=0.05;
				PEs.rotation.x -=0.05;

				CAS.rotation.y -=0.01;
				TRS.rotation.x +=0.005;
				BDsS.rotation.x -=0.05;
				BEsS.rotation.x +=0.05;
				PDsS.rotation.x +=0.05;
				PEsS.rotation.x -=0.05;
			}else{
				CA.rotation.y +=0.01;
				TR.rotation.x -=0.005;
				BDs.rotation.x +=0.05;
				BEs.rotation.x -=0.05;
				PDs.rotation.x -=0.05;
				PEs.rotation.x +=0.05;

				CAS.rotation.y +=0.01;
				TRS.rotation.x -=0.005;
				BDsS.rotation.x +=0.05;
				BEsS.rotation.x -=0.05;
				PDsS.rotation.x -=0.05;
				PEsS.rotation.x +=0.05;
			}
			group.position.x +=0.1;
			if(group.position.x>50){group.position.x=-50;}
			groupS.position.x -=0.1;
			if(groupS.position.x<-50){groupS.position.x=50;}
			if(group.position.x>-1){
				group.rotation.y=p;
				groupS.rotation.y=0;
				group.scale.set(0.5,0.6,0.5);
				groupS.scale.set(0.5,0.6,0.5);
				BDsS.rotation.x=0;
				BEsS.rotation.x=0;
				PDsS.rotation.x=0;
				PEsS.rotation.x=0;
				BDs.rotation.x=0;
				BEs.rotation.x=0;
				PDs.rotation.x=0;
				PEs.rotation.x=0;
					group.position.z -=0.05;
					group.position.y -=0.03;
					groupS.position.z -=0.05;
					groupS.position.y -=0.03;
				pare=1;
			}
		}
		if(pare==1){
			group.position.z -=0.05;
			group.position.y -=0.03;
			groupS.position.z -=0.05;
			groupS.position.y -=0.03;
			if(PDs.rotation.x> 1.07){rot[1]=1;}
			if(PDs.rotation.x<-1.07){rot[1]=0;}
			if(rot[1]==0){
				CA.rotation.y -=0.01;
				TR.rotation.x +=0.005;
				BDs.rotation.x -=0.05;
				BEs.rotation.x +=0.05;
				PDs.rotation.x +=0.05;
				PEs.rotation.x -=0.05;

				CAS.rotation.y -=0.01;
				TRS.rotation.x +=0.005;
				BDsS.rotation.x -=0.05;
				BEsS.rotation.x +=0.05;
				PDsS.rotation.x +=0.05;
				PEsS.rotation.x -=0.05;
			}else{
				CA.rotation.y +=0.01;
				TR.rotation.x -=0.005;
				BDs.rotation.x +=0.05;
				BEs.rotation.x -=0.05;
				PDs.rotation.x -=0.05;
				PEs.rotation.x +=0.05;

				CAS.rotation.y +=0.01;
				TRS.rotation.x -=0.005;
				BDsS.rotation.x +=0.05;
				BEsS.rotation.x -=0.05;
				PDsS.rotation.x -=0.05;
				PEsS.rotation.x +=0.05;
			}
			textMesh.visible=true;
			if(group.position.z<-40){pare=2;}
		}
		if(pare==2){
			group.rotation.y=-p/2;
			groupS.rotation.y=p/2;
			group.position.set(-50,-14,-5);
			groupS.position.set(50,-14,-5);
			textMesh.visible=false;
			pare=0;
		}
	}

	if(t<31){t++;}
	if(t==30 && tex && innerSphere){
		groupmoon.add(innerSphere);
		groupmoon.position.y=5;;
		scene.add(groupmoon);
	}

	function alterando(){
		CA=ste[0].clone();// Vivi or Steve Head
		TR=ste[2].clone();// Torso
		ste[1].rotation.z=-p/2;// Arm
		//ste[3] Arm
		//ste[5] Leg
		BDs=ste[1].clone();BEs=BDs.clone();// Arms
		PDs=ste[4].clone();PEs=PDs.clone();// Legs
		CA.position.set(0,5,0);
		TR.position.set(0,4,0);
		BDs.position.set(-1.5,4,0);BEs.position.set( 1.5,4,0);
		PDs.position.set(-0.5,1,0);PEs.position.set( 0.5,1,0);
		groupCATR.add(CA);groupCATR.add(TR);
			group.add(groupCATR);
			group.add(PDs);
			group.add(PEs);
			group.add(BDs);
			group.add(BEs);
			group.rotation.y=p/2;
			group.position.set(-50,-14,-5);
			//group.position.set(-2,-14,-5);
			group.scale.set(0.4,0.6,0.4);
			textMesh.visible=false;
			group.add(textMesh);
			scene.add(group);

		CAS=ste[10].clone();
		TRS=ste[12].clone();
		ste[11].rotation.z=-p/2;
		BDsS=ste[11].clone();BEsS=BDsS.clone();// Arms
		PDsS=ste[14].clone();PEsS=PDsS.clone();// Legs
		CAS.position.set(0,5,0);
		CAS.rotation.y=p;
		TRS.position.set(0,4,0);
		TRS.rotation.y=p;
		BDsS.position.set(-1.5,4,0);BEsS.position.set( 1.5,4,0);
		PDsS.position.set(-0.5,1,0);PEsS.position.set( 0.5,1,0);
		groupCATRS.add(CAS);groupCATRS.add(TRS);
			groupS.add(groupCATRS);
			groupS.add(PDsS);
			groupS.add(PEsS);
			groupS.add(BDsS);
			groupS.add(BEsS);
			groupS.rotation.y=p/2;
			groupS.position.set(50,-14,-5);
			//groupS.position.set(2,-14,-5);
			groupS.scale.set(0.4,0.6,0.4);
			//textMesh.visible=false;
			//groupS.add(textMesh);
			scene.add(groupS);
		altera++;
	}

	renderer.render(scene,camera);
}

init();
animate();

</script>

</body>
</html>
