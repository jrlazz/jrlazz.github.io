<style>
body{overflow:hidden;margin:0px;background:#036;font-family:monospace;font-size:10.25pt;}
span{position:absolute;left:10px;top:10px;color:#990;font-size:20.5px;}

<body>
<span>Tiny Fat Line Code</span>
<script type="importmap">
{
	"imports":{
		"three":"https://unpkg.com/three@0.186.0/build/three.module.js",
		"three/addons/":"https://unpkg.com/three@0.186.0/examples/jsm/"
	}
}
</script>

<script type="module">

import * as THREE from 'three';

import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import * as GeometryUtils from 'three/addons/utils/GeometryUtils.js';

var renderer,scene,camera,controls,geo,mat,line,gui;
const x=23.0505;
const y=40.053;
const p=Math.PI;
var t=0;

function init() {

	renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
	renderer.setPixelRatio(window.devicePixelRatio);
	renderer.setSize(window.innerWidth,window.innerHeight);
	renderer.setClearColor('#036',1);
	document.body.appendChild(renderer.domElement);

	scene=new THREE.Scene();

	camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,1,1000);
	camera.position.set(0,0,240);

	controls=new OrbitControls(camera,renderer.domElement);

	var points=[
		0,0,0,
		x,y,0,
		x*2,0,0,
		x*3,y,0,
		x*4,0,0,
		x*5,y,0,
		x*6,0,0,
		x*7,y,0,
		x*8,0,0,
			0,0,0,
		x*2,y*2,0,
		x*3,y,0,
		x*4,y*2,0,
		x*5,y,0,
		x*6,y*2,0,
		x*7,y,0,
			x,y,0,
		x*2,y*2,0,
		x*3,y*3,0,
		x*4,y*2,0,
		x*5,y*3,0,
		x*6,y*2,0,
			x*2,y*2,0,
		x*3,y*3,0,
		x*4,y*4,0,
		x*5,y*3,0,
			x*3,y*3,0,

	];

	geo=new LineGeometry();
	geo.setPositions(points);
	mat=new LineMaterial({color:'#0c0',linewidth:3});
	line=new Line2(geo,mat);
	line.computeLineDistances();
	line.position.set(-x*2,-y*2,0);
	line.rotation.z=p/4;
	scene.add(line);

	window.addEventListener('resize',onWindowResize);

	gui=new GUI();
	const param={'width':3,'color':line.material.color.getHex(THREE.SRGBColorSpace)};
	const widthController=gui.add(param,'width',1,10).name('width (pixels)').onChange(function(val){mat.linewidth=val;});
	gui.addColor(param,'color').onChange(function(val){line.material.color.setHex(val,THREE.SRGBColorSpace);});
}

function onWindowResize(){
	camera.aspect=window.innerWidth/window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate(){
	requestAnimationFrame(animate);
	controls.update();
	renderer.render(scene,camera);
}

init();
animate();

/*
A tiny fat line code and a logo
*/

</script>
</body>
</html>
