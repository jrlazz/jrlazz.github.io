<!DOCTYPE html>
<html lang="en">
<head>
<title>path_walk_6.html</title>
<meta charset="utf-8" />
<link rel="icon" type="image/png" href="../img/github-mark.png">
<meta name="description" content="Path_Walk">
<meta name="twitter:image" content="img/ag_baboy_right.png" />
<meta name="twitter:image:type" content="png" />
<meta name="twitter:image:width" content="19" />
<meta name="twitter:image:height" content="47" />
<style>
body {overflow:hidden;margin:0;background-color:#012;}
span,button {font-family:Lucida Console;font-size:10pt;font-weight:bold;position:absolute;left:10px;top:30px;color:#009;text-align:center;}	
</style>

<script type="importmap">
{
	"imports":{
		"three":"https://unpkg.com/three@0.186.0/build/three.module.js",
		"three/addons/":"https://unpkg.com/three@0.186.0/examples/jsm/"
	}
}
</script>

</head>

<body>

<span style="top:5px;color:#0ff;width:99%;">... following the mesh on a tunnel </span>
<button id="big" style="background-color:#0ff;color:#009;border:2px outset #0ff;cursor:pointer;">follow again</button>
</span>

<script type="module">
	
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

var scene,camera,renderer,controls,light,pointlight,points,curve,tex,geo,mat,tube1,tube2;
var t=0;
var sim=0;
const p=Math.PI;
var camPos=0;
var progress=0;
const vel=0.001;
const camOffset=0.04; 
var dbig=document.getElementById("big");
dbig.style.display="none";

	dbig.onclick=function BIG(){sim=0;dbig.style.display="none";}

	scene=new THREE.Scene();

	camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,1000);
	camera.position.set(-10,10,30 );
	camera.lookAt( scene.position );


	renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
	renderer.setClearColor('#012',1);
	renderer.setPixelRatio(devicePixelRatio);
	renderer.setSize(innerWidth,innerHeight);
	document.body.appendChild(renderer.domElement);
		
	window.addEventListener('resize',function(){
		camera.aspect=window.innerWidth/window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize(window.innerWidth,window.innerHeight);
	}, false );

	controls=new OrbitControls(camera,renderer.domElement);

	light=new THREE.AmbientLight('#fff',0.2) ;
	scene.add(light);

	pointlight=new THREE.PointLight('#fff',3) ;
	scene.add(pointlight);

	points=[
		new THREE.Vector3(-10, 0, 10),
		new THREE.Vector3(-5, 5, 5),
		new THREE.Vector3(5, -5, 5),
		new THREE.Vector3(10, 0, 10),
		new THREE.Vector3(40, 5, 10)
	];
	curve=new THREE.CatmullRomCurve3(points);

	tex=new THREE.TextureLoader().load("img/gradient250.jpg");
	//tex.rotation=p/2; 
	tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
	tex.repeat.set(16,1);
	tex.colorSpace=THREE.SRGBColorSpace;

	geo=new THREE.TubeGeometry(curve,64,1,64,false);
	mat=new THREE.MeshStandardMaterial({color:'#600',side:THREE.FrontSide,wireframe:false,transparent:true,opacity:0.9} );
	tube1=new THREE.Mesh(geo,mat);
	mat=new THREE.MeshStandardMaterial({color:'#999',wireframe:false,side:THREE.BackSide,map:tex} );
	tube2=new THREE.Mesh(geo,mat);

	geo=new THREE.BufferGeometry().setFromPoints(curve.getPoints(50));
	mat=new THREE.LineBasicMaterial({color:'#666'});
	const curveObject=new THREE.Line(geo,mat);

	geo=new THREE.OctahedronGeometry(0.15);
	mat=new THREE.MeshNormalMaterial();
	const mesh=new THREE.Mesh(geo,mat);
	mesh.scale.setScalar(15);
	scene.add(mesh);

function animate() {
	requestAnimationFrame(animate);
	if(sim==0){
		mesh.rotation.x +=0.01;
		mesh.rotation.y -=0.01;
		mesh.rotation.z +=0.01;
		t++;
		if(t<80){
			progress +=vel;
			if(progress>1){progress=0;} 
			if(t==11){
				scene.remove(tube1);
				scene.remove(tube2);
				console.clear();
				pointlight.intensity=3;
			}
			const meshPosition=curve.getPointAt(progress);
			let camProgress=progress-camOffset;
			if(camProgress<0){camProgress +=1;}
		}
		if(t==80){
			mesh.scale.setScalar(1);
			scene.add(tube1);
			scene.add(tube2);
			scene.add(mesh);
		}
		if(t>80){
			progress +=vel;
			if(progress>1){
				progress=0;
				t=0;
				sim=1;
				dbig.style.display="";
				scene.remove(tube1);
				scene.remove(tube2);
				mesh.scale.setScalar(1);
			} 
			if(progress>0){
				const meshPosition=curve.getPointAt(progress);
				mesh.position.copy(meshPosition);
				if(t<950){
					const meshPositionpl=curve.getPointAt(progress+0.05);
					pointlight.position.copy(meshPositionpl);
				}else{
				mesh.rotation.y -=0.1;
					pointlight.intensity=0.5;
					const meshPositionpl=curve.getPointAt(progress);
					pointlight.position.copy(meshPositionpl);
				}
				const tangent=curve.getTangentAt(progress).normalize();
				const lookAtPoint=meshPosition.clone().add(tangent);
				let camProgress=progress-camOffset;
				if(camProgress<0){camProgress +=1;}
				camPos=curve.getPointAt(camProgress);
				camera.position.copy(camPos).add(new THREE.Vector3(0, 0.2,0));
				camera.lookAt(mesh.position);
			}
		}
	}

	renderer.render(scene,camera);
}

animate();

</script>
</body>
</html>
