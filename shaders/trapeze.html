<!DOCTYPE html>
<html lang="en">
<head>
<title>trapeze.html</title>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../img/github-mark.png">
<meta name="description" content="Circus Trapeze">
<meta name="twitter:image" content="img/ag_baboy_right.png" />
<meta name="twitter:image:type" content="png" />
<meta name="twitter:image:width" content="19" />
<meta name="twitter:image:height" content="47" />

<style>
body{overflow:hidden;margin:0px;background:#001;font-family:monospace;font-size:10.25pt;}
span{position:absolute;left:10px;top:10px;color:#990;font-size:20.5px;}
</style>

<script type="importmap">
{
	"imports":{
		"three":"https://unpkg.com/three@0.166.0/build/three.module.min.js",
		"three/addons/":"https://unpkg.com/three@0.166.0/examples/jsm/"
	}
}
</script>
</head>

<body>
<span id="spana">... He feels so good to be on a circus trapeze. ...</span>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { Timer } from 'three/addons/misc/Timer.js';

var camera,scene,loader,renderer,controls,geo,mat,pivot,axe;
var CA,TR,BD,BE,PD,PE,HD,HL;
const group=new THREE.Group();
const groupTR=new THREE.Group();
const groupcyl=new THREE.Group();
const groupvaivem=new THREE.Group();
const tex={};
const cyl=[];
var currentSkin=99;
var velo=0.5;
var ready=false;
var p=Math.PI;
var sig=1;
var rot=0;
var t=0;
const timer=new Timer();
var dspana=document.getElementById("spana");

function init(){
	scene=new THREE.Scene();
	camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,1000);
	camera.position.set(30,0,30);
	renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
	renderer.setPixelRatio(devicePixelRatio);
	renderer.setClearColor('#001',0);
	renderer.setSize(innerWidth,innerHeight);
	document.body.appendChild(renderer.domElement)

	loader=new THREE.TextureLoader();
	loader.load('images/circus.jpg',function(texture){
		texture.colorSpace=THREE.SRGBColorSpace;
		scene.background=texture;
	});

	addEventListener('resize',onWindowResize);
	controls=new OrbitControls(camera,renderer.domElement);

	scene.add(new THREE.AmbientLight('#fff',3));

	let objsLoaded=0;
	const needObjs=4;
	function maybeReady(){
		if(++objsLoaded<needObjs){return;}
		buildRig();
		applySkin(currentSkin);
		ready=true;
	}

	const manager=new THREE.LoadingManager();
		manager.onLoad=function LOAD(){
		console.log('textures + mtl loaded');
	};

	manager.onError=function(url){console.error('Error loading:',url);};

	const tl=new THREE.TextureLoader(manager);
	const texFiles={99:'ski99.png',98:'chi.png',49:'ski49.png',7:'ski07.png',44:'ski44.png',97:'Steve_from_site_2.png'};
	for(const [id,file] of Object.entries(texFiles)){
		tex[id]=tl.load(`models/${file}`);
		tex[id].colorSpace=THREE.SRGBColorSpace;
	}

	new MTLLoader(manager).load('models/skin.mtl', function(mat){
		mat.preload();
		const objLoader = new OBJLoader(manager).setMaterials(mat);
		objLoader.load('models/skin_hea.obj',function(o){CA=o; maybeReady();});
		objLoader.load('models/skin_tor.obj',function(o){TR=o; maybeReady();});
		objLoader.load('models/skin_arm.obj',function(o){BD=o; maybeReady();});
		objLoader.load('models/skin_leg.obj',function(o){PD=o; maybeReady();});
	});

	geo=new THREE.TorusGeometry(0.4,0.125,16,16,p+p/1.3);
	mat=new THREE.MeshStandardMaterial({color:'#630'});
	HD=new THREE.Mesh(geo,mat);
	HD.position.y=-3.1;
	HD.rotation.set(0,p/2,p/4);
	HL=HD.clone();

	geo=new THREE.CylinderGeometry(0.05,0.05,30);
	mat=new THREE.MeshNormalMaterial();
	cyl[1]=new THREE.Mesh(geo,mat);
	cyl[1].position.z=-2;
	cyl[2]=cyl[1].clone();
	cyl[2].position.z=2;

	geo=new THREE.CylinderGeometry(0.2,0.2,4);
	mat=new THREE.MeshNormalMaterial();
	cyl[3]=new THREE.Mesh(geo,mat);
	cyl[3].rotation.set(p/2,0,0);
	cyl[3].position.y=-15;
		cyl[4]=cyl[3].clone();
		cyl[4].position.y=15;

	axe=new THREE.AxesHelper(0.1);

	groupvaivem.position.y=-15;
	groupvaivem.add(cyl[1]);
	groupvaivem.add(cyl[2]);
	groupvaivem.add(cyl[3]);
	groupvaivem.add(cyl[4]);

	axe.add(groupvaivem);
	axe.position.y=27;

	//scene.add(axe);
	

} // init END

function buildRig(){
	BE=BD.clone();//BE.add(HL);BD.add(HD);
	PE=PD.clone();
	CA.position.set(    0,  5,0);
	TR.position.set(    0,  4,0);
	BD.position.set(-1.50,3.5,0);//BD.add(HD);
	BE.position.set( 1.50,3.5,0);
	PD.position.set(-0.50,-3.5,0);
	PE.position.set( 0.50,-3.5,0);
	TR.add(PD,PE);
	group.add(TR,CA,BD,BE);
	group.position.set(0,-36.5,0);
	group.rotation.y=p/2;
	group.scale.set(0.8,1,1);
	scene.add(group);
		BD.rotation.x =p;
		BE.rotation.x =p;
}

let skinMat=null;
function applySkin(id){
	const map=tex[id];
	if(!map){return;}
	if(!skinMat){
		skinMat=new THREE.MeshStandardMaterial({map});
	}else{
		skinMat.map=map;
	}
	skinMat.needsUpdate=true;
	for(const part of [CA,TR,BD,BE,PD,PE]){part.traverse(function(o){if(o.isMesh){o.material=skinMat;}});}
	currentSkin=id;
}

function updateWalk(dt){
	if(t<10){t++;}
	if(t==5){BE.add(HL);BD.add(HD);t=20;axe.add(group);scene.add(axe);}
	BE.add(HL);BD.add(HD);
	if(PD.rotation.x> 1.07){rot=1;}
	if(PD.rotation.x<-1.07){rot=0;}
	if(rot==0){
		CA.rotation.y -=dt*2;
		TR.rotation.x -=dt;
		PD.rotation.x +=dt;
		PE.rotation.x +=dt;
		axe.rotation.z +=0.0075;
	}else{
		CA.rotation.y +=dt*2;
		TR.rotation.x +=dt;
		PD.rotation.x -=dt;
		PE.rotation.x -=dt;
		axe.rotation.z -=0.0075;
	}
}

function onWindowResize(){
	camera.aspect=innerWidth/innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(innerWidth,innerHeight);
}

function animate(timestamp){
	requestAnimationFrame(animate);
	timer.update(timestamp);
	if(ready){updateWalk(timer.getDelta()*velo);}

	renderer.render(scene,camera);
}

init();
animate();

</script>
</body>
</html>
