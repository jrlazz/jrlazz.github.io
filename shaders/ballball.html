<!DOCTYPE html>
<html lang="en">
<head>
<title>ballball.html</title>
<meta charset="utf-8">

<link rel="icon" type="image/png" href="../img/github-mark.png">
<meta name="description" content="collision of two balls">
<meta name="twitter:image" content="img/ag_baboy_right.png" />
<meta name="twitter:image:type" content="png" />
<meta name="twitter:image:width" content="19" />
<meta name="twitter:image:height" content="47" />

<style>
body{overflow:hidden;margin:0px;background:#454;font-family:monospace;font-size:10.25pt;}
span{position:absolute;left:10px;top:10px;color:#ff0;font-size:10.25pt;z-index:1;}
button{position:absolute;left:10px;top:10px;background-color:#444;font-size:10.25pt;cursor:pointer;z-index:1;}
img{position:absolute;left:0px;top:0px;width:40px;}
</style>

<script type="importmap">
{
	"imports":{
		"three":"https://unpkg.com/three@0.184.0/build/three.module.min.js",
		"three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/"
	}
}
</script>

</head>

<body>
<img id="KS" src="img/pressP.png" style="left:-50%;top:25px;width:120px;opacity:0.4;"></img>
<span id="show" style="top:25px;left:150px;font-size:20.5px;color:#0f0;"></span>
<span id="quad" style="top:38px;left:66px;font-size:20.5px;color:#ff0;">1</span>
<span id="ytouch" style="top:80px;font-size:20.5px;color:#ff0;"></span>
<span id="cam-pos" style="font-size:9pt;left:100px;top:437px;color:#fff;"></span>
<span id="cam-rot" style="font-size:9pt;left:800px;top:437px;color:#fff;"></span>
<img id="relo" src="img/reload.png" style="left:30px;top:10px;width:80px;cursor:pointer;"></img>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function repress(){
	controls.enabled=false;camera.position.set(pcam[1],pcam[2],pcam[3]);camera.rotation.set(rcam[1],rcam[2],rcam[3]);
	control=1;
	quadrant++;
	if(quadrant==5){quadrant=1;}
	dquad.innerText=quadrant;
	switch(quadrant){
		case 1:s[0].position.x=dx;s[0].position.y=dy;	s[1].position.x=-dx;s[1].position.y=-dy;break;
		case 2:s[0].position.x=dx;s[0].position.y=-dy;	s[1].position.x=-dx;s[1].position.y=dy;break;
		case 3:s[0].position.x=-dx;s[0].position.y=-dy;	s[1].position.x=dx;s[1].position.y=dy;break;
		case 4:s[0].position.x=-dx;s[0].position.y=dy;	s[1].position.x=dx;s[1].position.y=-dy;break;
	}
	str="";
	dshow.innerText="";ti=0;ar=0;
	akin[0].position.copy(s[0].position)
		for(let z=0;z<50;z++){if(arrow[z]){scene.remove(arrow[z]);}}
		for(let k=1;k<8;k++){
			if(k!=qual){
				if(akin[k]){akin[k].position.copy(s[k].position);akin[k].visible=false;}
			}
		}
	s[3].position.set(55,15,0);
	s[5].position.set(-15,15,0);
		for(let k=0;k<8;k++){
			if(sTouch[k]){sTouch[k].position.copy(s[k].position);}
		}
	cylC.position.set(0,0,0);
	MayMoveMouse=1;
	walk=0;
	gru.position.copy(s[0].position);
	scene.add(gru);
	cylC.visible=false;
	MayClick=[];
	//console.clear();
}

let newspan;
for(let z=0;z<8;z++){
	newspan=document.createElement("span");
	newspan.className="tex";
	newspan.textContent="You may click now! "+String(z);
	newspan.style.fontSize="20.5px";
	newspan.style.color="#0f0";
	newspan.style.position="absolute";
	newspan.style.left="20%";
	newspan.style.top="10px";
	newspan.style.width="60%";
	newspan.style.textAlign="center";
	document.body.append(newspan);
}

let newimg;
for(let z=0;z<8;z++){
	newimg=document.createElement("img");
	newimg.className="ima";
	newimg.src="img/"+String(z)+"ball.png";
	if(z==0){newimg.src="";}
	newimg.style.position="absolute";
	newimg.style.left="40px";
	newimg.style.top="128px";
	newimg.style.width="60px";
	document.body.append(newimg);
}

var camera,scene,renderer,controls,tex,bump,geo,mat,mesh,line,cue;

const p=Math.PI,degrad=0.0174532925,raddeg=57.2958;
const gru=new THREE.Group();
const mouse=new THREE.Vector2(1,1);

var bId=function(id){return document.getElementById(id);}
	const drelo=bId("relo");
	const dytouch=bId("ytouch");
	const dshow=bId("show");
	const dquad=bId("quad");
	const dKS=bId("KS");

var akin=[],poi=[],dir=[],toDetect=[],pcam=[],rcam=[];
const s=[],sTouch=[],luz=[];
const arrow=[];

var ang=0,radang=0,control=1,found=100,walk=0;
var MayMoveMouse=1;
var speed=1;

var ti=0;
var ar=0;

var direction,distance,touchDir,touchPos,dirtoTouch,dirtoS1;

var inv=1;
var str="";

var ballD,cylC;

var quadrant=1;

var zer=0;
var qual=0;

var distancex=[];
var dist=[];
var MayClick=[];

var cor=[];
cor[1]='#d03';
cor[3]='#0c0';
cor[5]='#09c';

const pic=document.querySelectorAll('.ima'); 
if(pic.length>1){for(var i=0;i<pic.length;i++){pic[i].style.display='none';}}

const spa=document.querySelectorAll('.tex');
if(spa.length>1){for(var i=0;i<spa.length;i++){spa[i].style.visibility='hidden';}}

const radius=6;
const dx=30;const dy=15;

function init(){

	drelo.onclick=function RELO(){window.location.reload();}
	scene=new THREE.Scene();

	camera =new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,1,1000);
	camera.position.set(0,0,75);
	renderer=new THREE.WebGLRenderer({antialias:true});
	renderer.setSize(window.innerWidth,window.innerHeight);
	renderer.setClearColor("#454",1);

	document.body.appendChild(renderer.domElement);
	document.addEventListener('mousemove',onMouseMove,false);
	document.addEventListener('mousedown',onMouseDown,false);
	document.addEventListener('keydown',triggerAction);
	window.addEventListener('resize',onWindowResize);
	
	controls=new OrbitControls(camera,renderer.domElement);

	scene.add(new THREE.AmbientLight("#fff",2));

	luz[1]=new THREE.PointLight("#fff",5000);
	luz[1].position.set(0,50,0);
	scene.add(luz[1]);

function make(num,acor,sig){
	geo=new THREE.SphereGeometry(radius,32,32);
	mat=new THREE.MeshStandardMaterial({color:acor,metalness:0,roughness:0.2});
	s[num]=new THREE.Mesh(geo,mat);
	s[num].position.set(sig*dx,sig*dy,0);scene.add(s[num]);
	if(num==3){s[num].position.set(55,15,0);scene.add(s[num]);}
	if(num==5){s[num].position.set(-15,15,0);scene.add(s[num]);}
	akin[num]=s[num].clone();
	akin[num].material=s[num].material.clone();
	akin[num].material.transparent=true;
	akin[num].material.opacity=0.6;scene.add(akin[num]);
	sTouch[num]=akin[num].clone();scene.add(sTouch[num]);
	toDetect[num]=akin[num].clone();scene.add(toDetect[num]);toDetect[num].visible=false;
	//toDetect[num]=new THREE.Mesh(geo,mat);scene.add(toDetect[num]);toDetect[num].visible=false;
}

	// ******** Balls START
		make(0,'#ccc',1);
		make(1,'#f00',-1);
		make(3,'#080',1);
		make(5,'#09c',1);
	sTouch[3].position.set(35,-15,0);sTouch[3].visible=false;
	sTouch[5].position.set(-15,15,0);sTouch[5].visible=false;
	// ******** Balls END

	geo=new THREE.CylinderGeometry(0.4,0.4,20);
	mat=new THREE.MeshStandardMaterial({color:'#f9c'});
	cylC=new THREE.Mesh(geo,mat);
	cylC.rotation.x=p/2;
	cylC.position.set(0,0,0);scene.add(cylC);cylC.visible=false;

	geo=new THREE.SphereGeometry(0.1,32,32);
	mat=new THREE.MeshStandardMaterial({color:'#990'});
	ballD=new THREE.Mesh(geo,mat);
	ballD.position.set(0,0,0);scene.add(ballD);
	// ******** Balls END

	// ******** Shot line START
	geo=new THREE.CylinderGeometry(0.2,0.2,200);
	mat=new THREE.MeshStandardMaterial({color:'#0ff',transparent:true,opacity:0.5});
	geo.translate(0,100,0);
	line=new THREE.Mesh(geo,mat);
	gru.add(line);
	// ******** Shot line END

	// ******** Cue START
	geo=new THREE.CylinderGeometry(0.5,3,100);
	mat=new THREE.MeshStandardMaterial({color:'#960'});
	geo.translate(0,-50,0);
	cue=new THREE.Mesh(geo,mat);
	cue.position.set(0,-12,0)
		geo=new THREE.CylinderGeometry(0.5,0.5,1);
		mat=new THREE.MeshStandardMaterial({color:'#0ff'});
		const pit=new THREE.Mesh(geo,mat);
		pit.position.set(0,0,0)
		cue.add(pit);
		gru.add(cue);
	// ******** Cue END

	gru.position.copy(s[0].position);
	scene.add(gru);
	pcam[1]=camera.position.x;pcam[2]=camera.position.y;pcam[3]=camera.position.z;
	rcam[1]=camera.rotation.x;rcam[2]=camera.rotation.y;rcam[3]=camera.rotation.z;

} // init END

function onMouseMove(event){
	if(MayClick[1]==1){MayClick[1]=0;}
	if(MayClick[3]==1){MayClick[3]=0;}
	if(MayClick[5]==1){MayClick[5]=0;}

	if(MayMoveMouse==1){
		finder();
		event.preventDefault();
		mouse.x=(event.clientX/window.innerWidth)*2-1;
		ang=mouse.x*p*360/(window.innerWidth-10/2);
		radang=degrad*180*ang;
	}
}

function onMouseDown(event){
	for(let k=1;k<8;k++){
		if(MayClick[k]==1){
			if(walk<2){
				walk=1;
				cue.position.set(0,-6.2,0);
				const tout=setTimeout(function(){cue.position.set(0,-12,0);clearTimeout(tout);},400);
			}
			if(MayClick[k]==1){MayClick[k]=0;}
		}
	}
}

function finder(){
	origin=s[0].position.clone();
	direction=new THREE.Vector3(Math.cos(radang+p/2),Math.sin(radang+p/2),0).normalize();
	// Start fresh: no target found yet
	qual=0;
	for(let z=1;z<9;z++){
		if(toDetect[z]){
			const position1=s[0].position;
			const position2=s[z].position;
			distancex[z]=position1.distanceTo(position2);
			toDetect[z].position.copy(s[0].position);
			toDetect[z].position.addScaledVector(direction,distancex[z]);
			dist[z]=toDetect[z].position.distanceTo(s[z].position);
			if(dist[z]<=(radius*2)){
				toDetect[z].visible=true;
				pic[z].style.display='block';
				spa[z].style.visibility="visible";
				qual=z;
				MayClick[z]=1;
			}else{
				toDetect[z].visible=false;
				pic[z].style.display='none';
				spa[z].style.visibility="hidden";
				MayClick[z]=0;
			}
		}
	}

	// Nothing is being aimed at
	if(qual==0)return;
	// -------------------------------------------------
	// Direction from white ball toward target ball
	// -------------------------------------------------
	const po3=new THREE.Vector3();
	po3.subVectors(s[qual].position,s[0].position).normalize();
	// -------------------------------------------------
	// Decide which side of po3 the incoming direction is
	// -------------------------------------------------
	const cross=direction.x*po3.y-direction.y*po3.x;
	if(cross>0){
		inv=-1;
	}else{
		inv=1;
	}
}

function animate(){
	requestAnimationFrame(animate);
	gru.rotation.z=radang;
	if(control==1){controls.enabled=true;}
	if(walk==1){
		MayMoveMouse=0;
		toDetect[qual].visible=false;
		MayClick=0;
		if(ar==0){
			arrow[1]=new THREE.ArrowHelper(direction,s[0].position,100,'#ccc',10,2);
			scene.add(arrow[1]);
			ar=1;
		}

		s[0].position.addScaledVector(direction,speed);
		const distance=s[0].position.distanceTo(s[qual].position);
		const minDistance=radius*2;
//console.log(s[0].position.x);
		if (distance<=minDistance){
			walk=2;
    			// Get the direction vector from s[0] to s[qual]
    			touchDir=new THREE.Vector3().subVectors(s[qual].position,s[0].position).normalize();
//console.log("s[0] position:"+s[0].position.x+" " + s[0].position.y);
    			// Move outward from Ball A's center by its radius
   	 		touchPos=new THREE.Vector3().copy(s[0].position).addScaledVector(touchDir,radius);
    			// touchPos now holds the exact Vector3 of the collision point
//console.log("Surfaces touch position:",touchPos);
			cylC.position.copy(touchPos);
			sTouch[0].position.copy(s[0].position);
			// Direction & movement after touch
			poi[0]=new THREE.Vector3(touchPos.x,touchPos.y,0); // Start point
			poi[1]=new THREE.Vector3(s[qual].position.x,s[qual].position.y,0); // Target point
			// Create an empty vector to store the direction
			dir[1]=new THREE.Vector3();
			// Calculate direction (poi[1] - poi[0]) and normalize it
			dir[1].subVectors(poi[1],poi[0]).normalize();
//console.log("dir[1]:",dir[1]); // Yields a unit vector pointing from s[1] to outside
			arrow[2]=new THREE.ArrowHelper(dir[1],s[qual].position,30,cor[qual],10,2);
			scene.add(arrow[2]);
				//s[qual].position.addScaledVector(dir[1],30);
			dir[0]=dir[1].clone();
			ballD.position.set(s[0].position.x,s[0].position.y,0);
			dir[0].applyAxisAngle(new THREE.Vector3(0,0,1),inv*p/2);
//console.log("dir[0]:",dir[0]); // Yields a unit vector pointing from s[0] to outside
			arrow[3]=new THREE.ArrowHelper(dir[0],ballD.position,30,'#ccc',10,2);
			scene.add(arrow[3]);
				//s[0].position.addScaledVector(dir[0],30);
			const pStart=new THREE.Vector3(akin[0].position.x,akin[0].position.y,0);
			const pEnd=new THREE.Vector3(touchPos.x,touchPos.y,0);
			const dirStartEndTouch=new THREE.Vector3().subVectors(pEnd,pStart);
			dirStartEndTouch.normalize();
			arrow[12]=new THREE.ArrowHelper(dirStartEndTouch,pStart,100,'#ff0',10,2);
				scene.add(arrow[12]);
			const pStart2=new THREE.Vector3(akin[0].position.x,akin[0].position.y,0);
			const pEnd2=new THREE.Vector3(akin[qual].position.x,akin[qual].position.y,0);
			const dirStartEndS1=new THREE.Vector3().subVectors(pEnd2,pStart2);
			dirStartEndS1.normalize();
			arrow[13]=new THREE.ArrowHelper(dirStartEndS1,pStart2,100,cor[qual],10,2);
					scene.add(arrow[13]); // inverted for ball 3 ??????????
			getSignedAngle(dirStartEndTouch,dir[1],"other");
			getSignedAngle(dirStartEndTouch,dir[0],"white");
			function getSignedAngle(dir1,dir2,ball){
				const cross=dir1.x * dir2.y - dir1.y * dir2.x;
				const dot  =dir1.x * dir2.x + dir1.y * dir2.y;
				const angle=Math.atan2(cross,dot);
				if(ball=="other"){zer=Math.abs(angle);}//alert(angle);}
				str=str+"angle relative "+ball+"= "+(angle*raddeg).toFixed(1)+"\xB0\n";
				dshow.innerText=str;
				return angle * raddeg;
			}
			cylC.visible=true;
			const setin=setInterval(anda,10);
			function anda(){
				ti++;
				if(zer>0.07){s[0].position.addScaledVector(dir[0],ti/50);}
				s[qual].position.addScaledVector(dir[1],ti/50);
				if(ti==57){clearInterval(setin);}
			}
		}
	}
	renderer.render(scene,camera);
}

function triggerAction(event){
	//alert(event.code);
	switch (event.code) {
		case 'ArrowRight':finder();radang=radang-p/4000;break;
		case 'ArrowLeft':finder();radang=radang+p/4000;break;
		case 'ArrowUp':finder();radang=radang+p/4000;break;
		case 'ArrowDown':finder();radang=radang-p/4000;break;
		case 'KeyZ':location.reload();break;
		case 'KeyS':repress();break;
		case 'Space':
		if(walk<2){
			walk=1;
			cue.position.set(0,-6.2,0);
			const tout=setTimeout(function(){cue.position.set(0,-12,0);clearTimeout(tout);},400);
		};break;
	}
}

function onWindowResize(){
	camera.aspect=window.innerWidth/window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth,window.innerHeight);
}

//console.clear();
init();
animate();
dKS.style.left=window.innerWidth-140+"px";
</script>

</body>
</html>
